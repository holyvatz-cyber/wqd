:root{
  --blue:#0099DE;--blue-d:#0077B3;--navy:#003778;--ink:#03243C;--muted:#5A6B7B;--line:#DCE4EC;
  --bg:#F3F6F9;--card:#FFFFFF;--soft:#E9F5FC;--yellow:#FFD25C;--red:#D7263D;--orange:#E8730C;--green:#2E9E5B;
  --shadow:0 1px 2px rgba(3,36,60,.06),0 8px 24px rgba(3,36,60,.07);
  --font:'Knauf Screen',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head:'Knauf Screen Head','Knauf Screen',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6EEF5;--muted:#9AB0C3;--line:#23384C;--bg:#0B1722;--card:#11212F;--soft:#0F2E44;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{--ink:#E6EEF5;--muted:#9AB0C3;--line:#23384C;--bg:#0B1722;--card:#11212F;--soft:#0F2E44;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* Header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue) 0 70%,var(--navy) 70%)}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.brand b{font-family:var(--head);display:block;font-size:17px;line-height:1.05}
.brand small{display:block;color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
nav.main a:hover{background:var(--soft)}
nav.main a.on{color:var(--blue);background:var(--soft)}
.lang{display:flex;border:2px solid var(--blue);border-radius:99px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:none;padding:4px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--blue)}
.lang button.on{background:var(--blue);color:#fff}
.burger{display:none;border:0;background:none;padding:8px;margin-left:auto;cursor:pointer;color:var(--ink)}
@media (max-width:900px){
  .burger{display:block}
  nav.main{position:absolute;left:0;right:0;top:68px;background:var(--card);flex-direction:column;padding:8px 16px 16px;border-bottom:1px solid var(--line);display:none;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px}
  .lang{margin-left:0}
}

/* Hero */
.hero{background:var(--blue);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-8%;top:0;bottom:0;width:46%;background:var(--navy);transform:skewX(-18deg);transform-origin:top}
.hero .wrap{position:relative;z-index:1;padding-top:52px;padding-bottom:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,54px);margin-bottom:14px}
.hero p.lead{font-size:clamp(16px,2vw,19px);max-width:560px;opacity:.95;margin:0 0 24px}
.kicker{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:16px}
.search{display:flex;background:#fff;border-radius:99px;padding:5px 5px 5px 20px;max-width:520px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.search input{flex:1;border:0;outline:0;background:none;color:#03243C;font-size:16px;min-width:0}
.search span{background:var(--navy);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:var(--r);padding:16px;backdrop-filter:blur(4px)}
.stat b{display:block;font-family:var(--head);font-size:34px;line-height:1}
.stat span{font-size:13px;opacity:.9}
.prog{grid-column:1/-1}
.prog .pb{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:8px}
.prog .pb i{display:block;height:100%;background:var(--yellow);border-radius:9px;transition:width .4s}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:28px;padding-top:36px;padding-bottom:40px}.hero::after{width:30%;right:-15%}}

/* Sections */
section.blk{padding:40px 0}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:clamp(24px,3vw,32px);margin:0}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.chip.ph{padding:6px 11px;font-family:var(--head)}
.filters{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:22px}

/* Tool tiles (periodic table) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border-radius:12px;padding:14px 14px 12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border-top:5px solid var(--c);transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column;min-height:168px}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(3,36,60,.14)}
.tile .no{position:absolute;top:10px;right:12px;font-size:12px;color:var(--muted);font-weight:700}
.tile .sym{font-family:var(--head);font-size:38px;line-height:1;color:var(--c);margin:6px 0 8px}
.tile h3{font-size:15px;margin:0 0 4px;font-family:var(--font);font-weight:700}
.tile p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4;flex:1}
.tile .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.phs{display:flex;gap:3px}
.phs i{font-style:normal;font-size:10.5px;font-weight:700;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:var(--soft);color:var(--blue-d)}
.phs i.off{opacity:.25}
.done-b{font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:3px}
.tile .play{font-size:11px;font-weight:700;color:var(--orange)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Cards row */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card.link{text-decoration:none;color:var(--ink);display:block;transition:transform .15s}
.card.link:hover{transform:translateY(-3px)}
.card .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--head);font-size:18px;margin-bottom:12px}
.card h3{font-size:19px}
.card p{color:var(--muted);margin:0}

/* Tool page */
.crumb{font-size:14px;color:var(--muted);padding:18px 0 0}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--blue)}
.thead{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:18px 0 26px}
.bigsym{width:108px;height:108px;border-radius:16px;background:var(--c);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--head);font-size:46px;line-height:1;box-shadow:var(--shadow)}
.bigsym small{font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:.9}
.thead h1{font-size:clamp(26px,4vw,40px);margin-bottom:6px}
.thead p{margin:0;color:var(--muted);font-size:18px}
.thead .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--blue-d)}
.acts{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.ghost:hover{background:var(--soft)}
.btn.ok{background:var(--green)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.navy{background:var(--navy)}
@media (max-width:760px){.thead{grid-template-columns:auto 1fr}.thead .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.bigsym{width:80px;height:80px;font-size:34px}}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.learn{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.learn .full{grid-column:1/-1}
@media (max-width:860px){.learn{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.box h3{font-size:18px;display:flex;align-items:center;gap:8px}
.box h3 .n{width:26px;height:26px;border-radius:7px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:14px}
.box p{margin:0}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
ul.chk{list-style:none;padding:0;margin:0}
ul.chk li{padding:6px 0 6px 28px;position:relative}
ul.chk li::before{content:"";position:absolute;left:2px;top:12px;width:14px;height:8px;border-left:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:rotate(-45deg)}
ul.tip li::before{border:0;width:10px;height:10px;background:var(--yellow);border-radius:2px;transform:rotate(45deg);top:13px}
.example{background:var(--navy);color:#fff}
.example h3 .n{background:rgba(255,255,255,.15);color:var(--yellow)}
.pn{display:flex;justify-content:space-between;gap:12px;margin:28px 0 10px}
.pn a{flex:1;max-width:48%;background:var(--card);border-radius:var(--r);padding:14px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.pn a small{display:block;color:var(--muted);font-size:12px}
.pn a b{font-size:15px}
.pn a.nx{text-align:right;margin-left:auto}

/* Widgets */
.wg{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.wg h3{font-size:19px;margin-bottom:4px}
.wg .hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.wgrid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.wgrid{grid-template-columns:1fr}}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.in,.fld input,.fld select,.fld textarea,table.ed input,table.ed select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);outline:0;min-width:0}
.fld textarea{min-height:120px;resize:vertical;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,table.ed input:focus,table.ed select:focus{border-color:var(--blue);background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
table.ed{width:100%;border-collapse:collapse;font-size:14px}
table.ed th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:4px 4px;text-transform:uppercase;letter-spacing:.03em}
table.ed td{padding:3px 4px;vertical-align:middle}
table.ed td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--red);background:var(--soft)}
.tscroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;border-left:4px solid var(--blue)}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--head);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi.good{border-color:var(--green)}.kpi.warn{border-color:var(--orange)}.kpi.bad{border-color:var(--red)}
.insight{background:var(--soft);border-radius:10px;padding:12px 14px 12px 46px;font-size:15px;margin-top:14px;position:relative}
.insight::before{content:"i";position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;font-family:Georgia,serif}
.insight.bad{background:rgba(215,38,61,.1)}.insight.bad::before{background:var(--red);content:"!"}
.insight.good{background:rgba(46,158,91,.12)}.insight.good::before{background:var(--green);content:"✓";font-family:inherit}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.ch .lbl{fill:var(--ink);font-weight:700}
svg.ch .grid line{stroke:var(--line)}
svg.ch .axis{stroke:var(--muted);stroke-width:1}
svg.ch .s-ink{stroke:var(--ink)}svg.ch text.t-ink{fill:var(--ink)}svg.ch .s-line{stroke:var(--line)}svg.ch .f-card{fill:var(--card)}svg.ch .f-ink{fill:var(--ink)}
@media (max-width:600px){.oeeg{grid-template-columns:1fr!important}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* specific widgets */
.tally{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--blue-d);font-weight:700}
.cs td.cell{text-align:center;padding:2px}
.cs .cellb{display:flex;align-items:center;justify-content:center;gap:2px;background:var(--bg);border-radius:8px;padding:3px;min-width:76px}
.cs .cellb button{border:0;width:24px;height:24px;border-radius:6px;background:var(--card);cursor:pointer;font-weight:700;color:var(--blue)}
.cs .cellb button:hover{background:var(--blue);color:#fff}
.cs .cellb b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.waste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wc{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--blue)}
.wc .L{font-family:var(--head);font-size:30px;color:var(--blue);line-height:1}
.wc h4{margin:0;font-size:16px}
.wc p{margin:0;font-size:13px;color:var(--muted)}
.wc .ex{font-size:13px;color:var(--ink);font-style:italic}
.cnt{display:flex;align-items:center;gap:8px;margin-top:auto}
.cnt button{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:var(--card);color:var(--blue);font-weight:700;cursor:pointer}
.cnt b{font-family:var(--head);font-size:20px;min-width:26px;text-align:center}
.dots{display:flex;gap:4px}
.dots button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);padding:0}
.dots button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.q5{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pill{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}
.sipoc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sipoc .col h4{background:var(--navy);color:#fff;text-align:center;padding:10px 6px;border-radius:10px 10px 0 0;margin:0;font-size:15px}
.sipoc .col h4 b{display:block;font-size:26px;color:var(--yellow)}
.sipoc .col textarea{width:100%;min-height:190px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:10px;background:var(--bg);font-size:14px;resize:vertical;line-height:1.6}
.sipoc .col.p h4{background:var(--blue)}
@media (max-width:760px){.sipoc{grid-template-columns:1fr 1fr}.sipoc .col.p{grid-column:1/-1;order:-1}}
.why{display:flex;flex-direction:column;gap:0}
.why .wi{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.why .wi label{font-family:var(--head);color:var(--blue);font-size:15px}
.why .arr{height:16px;margin-left:44px;border-left:3px solid var(--blue);position:relative}
.why .root{border:2px solid var(--orange)!important;background:rgba(232,115,12,.08)!important}
.a3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a3 .c{border:2px solid var(--navy);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.a3 .c h4{margin:0;background:var(--navy);color:#fff;padding:6px 10px;font-size:13px}
.a3 .c textarea{border:0;flex:1;min-height:110px;padding:10px;background:var(--card);resize:vertical;font-size:14px;outline:0}
.a3 .col{display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.a3{grid-template-columns:1fr}}
.d8{display:grid;gap:8px}
.d8 label{display:grid;grid-template-columns:auto 52px 1fr;gap:12px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer}
.d8 label b{font-family:var(--head);font-size:20px;color:var(--blue)}
.d8 input{width:20px;height:20px;accent-color:var(--green)}
.d8 label.ck{background:rgba(46,158,91,.12)}
.d8 label.ck span{text-decoration:line-through;color:var(--muted)}
.kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kb i{width:34px;height:46px;border-radius:4px;background:var(--yellow);border:2px solid var(--navy);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;color:var(--navy)}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.seq i{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-family:var(--head)}
.seqlbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}

/* Roadmap */
.road{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ph{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ph .hd{background:var(--blue);color:#fff;padding:16px;position:relative}
.ph:nth-child(2) .hd{background:#0088C8}.ph:nth-child(3) .hd{background:#0070AA}.ph:nth-child(4) .hd{background:#00538F}.ph:nth-child(5) .hd{background:var(--navy)}
.ph .hd b{font-family:var(--head);font-size:44px;line-height:1;display:block}
.ph .hd span{font-weight:700}
.ph .bd{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.ph .bd h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.ph .bd p{margin:0;font-weight:700}
.ph .bd ul{margin:0;padding-left:18px;font-size:14px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini a{text-decoration:none;font-size:13px;font-weight:700;border-radius:8px;padding:4px 8px;color:#fff;background:var(--c)}
@media (max-width:1000px){.road{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.road{grid-template-columns:1fr}}

/* Lean house */
.house{max-width:900px;margin:0 auto}
.house .roof{background:var(--navy);color:#fff;clip-path:polygon(50% 0,100% 70%,100% 100%,0 100%,0 70%);padding:70px 40px 22px;text-align:center;font-weight:700}
.house .roof h3{font-size:22px;color:var(--yellow);margin-bottom:6px}
.house .body{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;padding:12px 0}
.house .pil{background:var(--card);box-shadow:var(--shadow);border-radius:10px;padding:16px;text-align:center}
.house .pil h3{color:var(--blue);font-size:20px}
.house .base{background:var(--blue);color:#fff;border-radius:10px;padding:16px;text-align:center}
.house .base h3{font-size:20px}
.house .found{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px;text-align:center;margin-top:12px;font-weight:700}
.house .mini{justify-content:center}
.house .base .mini a{background:rgba(255,255,255,.18)}
@media (max-width:700px){.house .body{grid-template-columns:1fr}.house .roof{padding:56px 16px 18px}}

/* Quiz */
.quiz{max-width:760px;margin:0 auto}
.qbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.qbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:16px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(46,158,91,.12)}
.opt.wrong{border-color:var(--red);background:rgba(215,38,61,.1)}
.opt[disabled]{cursor:default}
.score{font-family:var(--head);font-size:72px;color:var(--blue);line-height:1}

/* Glossary */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gl div{background:var(--card);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.gl b{color:var(--navy);font-family:var(--head)}
:root[data-theme="dark"] .gl b{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gl b{color:var(--blue)}}
.gl p{margin:4px 0 0;font-size:14px;color:var(--muted)}

footer{margin-top:auto;background:var(--navy);color:#C9D8E6;font-size:14px}
footer .wrap{padding-top:22px;padding-bottom:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}

@media print{
  .top,footer,.tabs,.acts,.pn,.btns,.x,.noprint{display:none!important}
  body{background:#fff}
  .box,.wg,.card{box-shadow:none;border:1px solid #ccc}
  .tabpane{display:block!important}
}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

const PHASES = {
  D: { cs: 'Define', en: 'Define', csl: 'Definovat', enl: 'Define' },

const TOOLS = [

          en: ['Consider weighting by cost – the most frequent defect may not be the costliest', 'Drill down: break the biggest bar into another Pareto', 'Always put “Other” last'] },
  example: { cs: 'Z 260 vad za týden tvoří poškozená hrana a bubliny 68 %. Tým se zaměří nejdříve na tyto dvě kategorie.',
             en: 'Out of 260 defects per week, damaged edges and blisters make 68 %. The team focuses on these two first.' } },

{ id: 'ishikawa', sym: 'Is', cat: 'q7', ph: ['A'], widget: 'fishbone',
  name: { cs: 'Diagram příčin a následků (Ishikawa)', en: 'Cause & Effect (Ishikawa)' },
  short: { cs: 'Rybí kost – strukturovaný brainstorming příčin.', en: 'The fishbone – structured brainstorming of causes.' },
  what: { cs: 'Diagram ve tvaru rybí kosti, kde „hlava“ je problém (následek) a „kosti“ jsou kategorie možných příčin – typicky 6M: Člověk, Stroj, Metoda, Materiál, Měření, Prostředí. Pomáhá týmu nezapomenout na žádnou oblast.',
          en: 'A fishbone-shaped diagram where the “head” is the problem (effect) and the “bones” are categories of possible causes – typically 6M: Man, Machine, Method, Material, Measurement, Mother nature. It helps the team cover every area.' },
  when: { cs: ['Hledání možných příčin problému v týmu', 'Před sběrem dat k ověření hypotéz', 'Když je problém komplexní a příčin může být mnoho'],
          en: ['Team search for possible causes of a problem', 'Before collecting data to verify hypotheses', 'When the problem is complex with many potential causes'] },
  steps: { cs: ['Jasně formulujte problém do hlavy ryby', 'Nakreslete páteř a hlavní kosti (6M)', 'Brainstormujte příčiny ke každé kategorii', 'U každé příčiny se ptejte „Proč?“ – vznikají podpříčiny', 'Vyberte nejpravděpodobnější příčiny a ověřte je daty'],
           en: ['State the problem clearly in the fish head', 'Draw the spine and main bones (6M)', 'Brainstorm causes for each category', 'Ask “Why?” for each cause – sub-causes appear', 'Select the most likely causes and verify with data'] },
  tips: { cs: ['Příčiny jsou hypotézy – je nutné je ověřit', 'Nepište řešení, ale příčiny', 'Kombinujte s 5x Proč pro nejsilnější větve'],
          en: ['Causes are hypotheses – they must be verified', 'Write causes, not solutions', 'Combine with 5 Whys on the strongest branches'] },
  example: { cs: 'Problém „Bubliny v kartonu“: Stroj – teplota sušárny kolísá; Materiál – vlhkost kartonu; Metoda – rychlost linky; Měření – nekalibrovaný vlhkoměr…',
             en: 'Problem “Paper blisters”: Machine – dryer temperature fluctuates; Material – paper moisture; Method – line speed; Measurement – uncalibrated moisture meter…' } },

{ id: 'histogram', sym: 'Hi', cat: 'q7', ph: ['M', 'A'], widget: 'capability',
  name: { cs: 'Histogram', en: 'Histogram' },
  short: { cs: 'Tvar rozdělení dat na první pohled.', en: 'The shape of your data at a glance.' },
  what: { cs: 'Sloupcový graf četností naměřených hodnot rozdělených do tříd (intervalů). Ukazuje polohu, rozptyl a tvar rozdělení – zda je proces centrovaný, symetrický, dvouvrcholový nebo zda leží mimo toleranci.',
          en: 'A bar chart of measured values grouped into classes (bins). It reveals location, spread and shape – whether the process is centred, symmetric, bimodal or outside tolerance.' },
  when: { cs: ['Posouzení variability spojitých dat (rozměr, hmotnost, vlhkost)', 'Porovnání s tolerancí', 'Odhalení smíšených dat (dva vrcholy = dva stroje/směny)'],
          en: ['Assessing variation of continuous data (dimension, weight, moisture)', 'Comparing against specification limits', 'Detecting mixed data (two peaks = two machines/shifts)'] },
  steps: { cs: ['Sesbírejte alespoň 50 měření', 'Určete počet tříd (≈ √n)', 'Spočítejte četnosti v třídách', 'Vykreslete sloupce bez mezer', 'Doplňte toleranční meze a vyhodnoťte tvar'],
           en: ['Collect at least 50 measurements', 'Choose the number of bins (≈ √n)', 'Count frequencies per bin', 'Draw bars without gaps', 'Add specification limits and assess the shape'] },
  tips: { cs: ['Dva vrcholy → stratifikujte data', 'Useknutý okraj → možné třídění nebo chyba měření', 'Histogram neukazuje čas – pro stabilitu použijte regulační diagram'],
          en: ['Two peaks → stratify the data', 'Cut-off edge → possible sorting or measurement issue', 'A histogram ignores time – use a control chart for stability'] },
  example: { cs: '100 měření tloušťky desky 12,5 mm: data jsou symetrická, ale střed je posunut k dolní mezi.',
             en: '100 measurements of 12.5 mm board thickness: data are symmetric but centred towards the lower limit.' } },

{ id: 'scatter', sym: 'Sd', cat: 'q7', ph: ['A', 'I'], widget: 'scatter',
  name: { cs: 'Bodový diagram', en: 'Scatter Diagram' },
  short: { cs: 'Souvisí spolu dvě proměnné?', en: 'Are two variables related?' },
  what: { cs: 'Graf dvojic hodnot (X, Y), který ukazuje, zda a jak silně spolu dvě proměnné souvisejí. Síla vztahu se vyjadřuje korelačním koeficientem r (−1 až +1).',
          en: 'A plot of (X, Y) pairs showing whether and how strongly two variables are related. The strength is expressed by the correlation coefficient r (−1 to +1).' },
  when: { cs: ['Ověření příčiny z Ishikawy daty', 'Hledání nastavení procesu (teplota vs. vlhkost)', 'Před regresí nebo DOE'],
          en: ['Verifying a cause from the fishbone with data', 'Finding process settings (temperature vs. moisture)', 'Before regression or DOE'] },
  steps: { cs: ['Sesbírejte alespoň 30 párů hodnot', 'X = možná příčina, Y = výsledek', 'Vykreslete body', 'Proložte trend a spočítejte r a R²', 'Interpretujte – pozor, korelace ≠ kauzalita'],
           en: ['Collect at least 30 pairs', 'X = possible cause, Y = result', 'Plot the points', 'Fit a trend line and compute r and R²', 'Interpret – remember, correlation ≠ causation'] },
  tips: { cs: ['|r| > 0,7 silný, 0,3–0,7 střední, < 0,3 slabý vztah', 'Hledejte odlehlé body a jejich příčinu', 'Nelineární vztah může mít nízké r'],
          en: ['|r| > 0.7 strong, 0.3–0.7 moderate, < 0.3 weak', 'Look for outliers and their cause', 'A non-linear relation can show a low r'] },
  example: { cs: 'Teplota sušárny (X) vs. zbytková vlhkost desky (Y): r = −0,93 – vyšší teplota výrazně snižuje vlhkost.',
             en: 'Dryer temperature (X) vs. residual board moisture (Y): r = −0.93 – higher temperature strongly reduces moisture.' } },

{ id: 'control', sym: 'Cc', cat: 'q7', ph: ['M', 'C'], widget: 'control',
  name: { cs: 'Regulační diagram (SPC)', en: 'Control Chart (SPC)' },
  short: { cs: 'Je proces stabilní? Hlas procesu v čase.', en: 'Is the process stable? The voice of the process over time.' },
  what: { cs: 'Časový graf s centrální linií a regulačními mezemi (±3σ) vypočtenými z dat procesu. Odlišuje náhodnou (běžnou) variabilitu od vymezitelných (zvláštních) příčin, na které je nutné reagovat.',
          en: 'A time-ordered chart with a centre line and control limits (±3σ) computed from process data. It separates common-cause (random) variation from special causes that require action.' },
  when: { cs: ['Sledování stability klíčových parametrů', 'Fáze Control – udržení zlepšení', 'Před výpočtem způsobilosti (proces musí být stabilní)'],
          en: ['Monitoring stability of key parameters', 'Control phase – sustaining the gain', 'Before capability analysis (process must be stable)'] },
  steps: { cs: ['Vyberte typ diagramu (I-MR, X̄-R, p, c…)', 'Sesbírejte 20–25 podskupin / hodnot', 'Vypočtěte centrální linii a meze', 'Vyhodnoťte pravidla (body mimo meze, trendy, běhy)', 'Reagujte na zvláštní příčiny, meze přepočítávejte jen po změně procesu'],
           en: ['Choose the chart type (I-MR, X̄-R, p, c…)', 'Collect 20–25 subgroups / values', 'Calculate centre line and limits', 'Apply the rules (points beyond limits, trends, runs)', 'Act on special causes; recalculate limits only after a process change'] },
  tips: { cs: ['Regulační meze ≠ toleranční meze!', 'Nereagujte na každý bod v mezích – vede to k přeregulování', 'Zapisujte do diagramu události (změna materiálu, údržba)'],
          en: ['Control limits ≠ specification limits!', 'Don’t react to every point inside the limits – that is tampering', 'Annotate events (material change, maintenance) on the chart'] },
  example: { cs: 'I-MR diagram plošné hmotnosti desky: po výměně dodavatele sádry vzniká běh 9 bodů nad průměrem – zvláštní příčina.',
             en: 'I-MR chart of board weight per m²: after a gypsum supplier change, a run of 9 points above the mean appears – a special cause.' } },

{ id: 'strat', sym: 'St', cat: 'q7', ph: ['M', 'A'], widget: 'strat',
  name: { cs: 'Stratifikace', en: 'Stratification' },
  short: { cs: 'Rozdělte data do vrstev a najděte skrytý vzor.', en: 'Split data into layers to find hidden patterns.' },
  what: { cs: 'Rozdělení dat podle zdroje – linka, směna, operátor, dodavatel, produkt. Souhrnná data často skrývají, že problém vzniká jen v jedné „vrstvě“. Stratifikace se často používá spolu s ostatními nástroji.',
          en: 'Splitting data by source – line, shift, operator, supplier, product. Aggregated data often hide that a problem comes from just one “layer”. It is usually combined with the other tools.' },
  when: { cs: ['Data pocházejí z více zdrojů', 'Histogram má dva vrcholy', 'Hledáte, KDE a KDY problém vzniká'],
          en: ['Data come from several sources', 'A histogram shows two peaks', 'You are looking for WHERE and WHEN a problem occurs'] },
  steps: { cs: ['Předem určete faktory stratifikace', 'Zaznamenávejte je při sběru dat', 'Rozdělte data podle faktorů', 'Porovnejte vrstvy graficky', 'Zaměřte analýzu na nejhorší vrstvu'],
           en: ['Decide stratification factors in advance', 'Record them while collecting data', 'Split the data by factor', 'Compare layers graphically', 'Focus analysis on the worst layer'] },
  tips: { cs: ['Bez zaznamenaných faktorů nelze data dodatečně rozdělit', 'Zkuste více faktorů – i kombinace (linka × směna)', 'Nezaměňujte vrstvu s příčinou – je to vodítko'],
          en: ['Without recorded factors you cannot split data later', 'Try several factors – including combinations (line × shift)', 'A layer is a clue, not the root cause'] },
  example: { cs: 'Vady hran celkem vypadají rovnoměrně, ale po rozdělení podle linek a směn je 45 % na lince B v noční směně.',
             en: 'Edge defects look evenly spread overall, but split by line and shift, 45 % occur on line B in the night shift.' } },

/* ---------------- LEAN ---------------- */
{ id: 'fives', sym: '5S', cat: 'lean', ph: ['I', 'C'], widget: 'fives',
  name: { cs: '5S', en: '5S' },
  short: { cs: 'Organizace pracoviště – základ všeho zlepšování.', en: 'Workplace organisation – the foundation of all improvement.' },
  what: { cs: '5S je metoda pro čisté, přehledné a bezpečné pracoviště: Separovat (Seiri), Systematizovat (Seiton), Stále čistit (Seiso), Standardizovat (Seiketsu), Sebedisciplína (Shitsuke). Snižuje hledání, chyby i úrazy.',
          en: '5S creates a clean, visual and safe workplace: Sort (Seiri), Set in order (Seiton), Shine (Seiso), Standardise (Seiketsu), Sustain (Shitsuke). It reduces searching, errors and accidents.' },
  when: { cs: ['Start Lean transformace', 'Nepořádek, hledání nářadí, nebezpečné pracoviště', 'Před zavedením standardizované práce a TPM'],
          en: ['Starting a Lean transformation', 'Clutter, searching for tools, unsafe workplace', 'Before standard work and TPM'] },
  steps: { cs: ['Separovat – červené štítky, odstranit nepotřebné', 'Systematizovat – místo pro vše, stínové tabule, značení', 'Stále čistit – čištění = kontrola', 'Standardizovat – fotostandardy, plány čištění', 'Sebedisciplína – pravidelné audity a vedení příkladem'],
           en: ['Sort – red tags, remove what is not needed', 'Set in order – a place for everything, shadow boards, labelling', 'Shine – cleaning is inspection', 'Standardise – photo standards, cleaning plans', 'Sustain – regular audits and leading by example'] },
  tips: { cs: ['5S není úklidová akce – je to systém', 'Bez auditů se pracoviště vrátí do původního stavu', 'Často se přidává 6. S = Safety (bezpečnost)'],
          en: ['5S is not a clean-up day – it is a system', 'Without audits the workplace slides back', 'A 6th S = Safety is often added'] },
  example: { cs: 'Na přestavbě formátovací pily byly zavedeny stínové tabule – hledání nářadí kleslo z 12 na 2 minuty na přestavbu.',
             en: 'Shadow boards at the cutting saw changeover cut tool searching from 12 to 2 minutes per changeover.' } },

{ id: 'muda', sym: 'Mu', cat: 'lean', ph: ['D', 'A'], widget: 'muda',
  name: { cs: '8 druhů plýtvání (TIMWOODS)', en: '8 Wastes (TIMWOODS)' },
  short: { cs: 'Naučte se plýtvání vidět – pak ho odstraníte.', en: 'Learn to see waste – then remove it.' },
  what: { cs: 'Muda je vše, co spotřebovává zdroje, ale nepřidává hodnotu pro zákazníka. TIMWOODS: Transport, Zásoby (Inventory), Pohyb (Motion), Čekání (Waiting), Nadvýroba (Overproduction), Zbytečné zpracování (Overprocessing), Vady (Defects), Nevyužité dovednosti (Skills).',
          en: 'Muda is anything that consumes resources but adds no value for the customer. TIMWOODS: Transport, Inventory, Motion, Waiting, Overproduction, Overprocessing, Defects, Skills (unused talent).' },
  when: { cs: ['Gemba walk a hledání příležitostí', 'Analýza mapy toku hodnot', 'Školení nových zaměstnanců'],
          en: ['Gemba walks and spotting opportunities', 'Value stream map analysis', 'Training new employees'] },
  steps: { cs: ['Jděte na místo (gemba)', 'Sledujte tok materiálu a lidí', 'Zapisujte pozorované plýtvání do kategorií', 'Kvantifikujte (čas, metry, kusy, Kč)', 'Navrhněte opatření a začněte od nejjednoduššího'],
           en: ['Go to the place (gemba)', 'Follow the flow of material and people', 'Record observed waste by category', 'Quantify it (time, metres, pieces, money)', 'Propose countermeasures, start with the easiest'] },
  tips: { cs: ['Nadvýroba je „matkou“ ostatních plýtvání', 'Ptejte se: zaplatil by za to zákazník?', 'Nevyužité nápady zaměstnanců jsou nejdražší plýtvání'],
          en: ['Overproduction is the “mother” of all wastes', 'Ask: would the customer pay for this?', 'Unused employee ideas are the costliest waste'] },
  example: { cs: 'Paletový vozík jezdí 400 m mezi linkou a skladem – přesunutím mezisupermarketu se ušetří 60 % jízd.',
             en: 'A forklift travels 400 m between line and warehouse – moving the supermarket saves 60 % of trips.' } },

{ id: 'vsm', sym: 'Vs', cat: 'lean', ph: ['D', 'A'], widget: 'vsm',
  name: { cs: 'Mapa toku hodnot (VSM)', en: 'Value Stream Mapping' },
  short: { cs: 'Celý tok materiálu a informací na jednom listu.', en: 'The whole material and information flow on one page.' },
  what: { cs: 'VSM zobrazuje všechny kroky od objednávky po dodání zákazníkovi včetně zásob a informačních toků. Odhalí poměr času, kdy se přidává hodnota, k celkové průběžné době (Process Cycle Efficiency).',
          en: 'VSM shows every step from order to delivery including inventories and information flows. It reveals the ratio of value-adding time to total lead time (Process Cycle Efficiency).' },
  when: { cs: ['Na začátku transformace celé produktové rodiny', 'Dlouhé průběžné doby a vysoké zásoby', 'Plánování budoucího stavu (Future State)'],
          en: ['At the start of a transformation of a product family', 'Long lead times and high inventory', 'Planning the Future State'] },
  steps: { cs: ['Vyberte produktovou rodinu', 'Projděte tok od zákazníka proti proudu', 'Zaznamenejte C/T, C/O, dostupnost, zásoby', 'Nakreslete časovou osu – čekání vs. zpracování', 'Navrhněte budoucí stav a akční plán'],
           en: ['Select a product family', 'Walk the flow upstream from the customer', 'Record C/T, C/O, uptime, inventory', 'Draw the timeline – waiting vs. processing', 'Design the future state and action plan'] },
  tips: { cs: ['Mapujte tužkou na gembě, ne v kanceláři', 'Typické PCE je pod 5 %', 'Zásoby převádějte na dny: zásoba / denní spotřeba'],
          en: ['Map with a pencil at the gemba, not in the office', 'Typical PCE is below 5 %', 'Convert inventory to days: stock / daily demand'] },
  example: { cs: 'Od příjmu sádrovce po expedici trvá tok 6,2 dne, z toho přidávání hodnoty jen 47 minut (PCE 0,5 %).',
             en: 'From gypsum receipt to shipping the flow takes 6.2 days, of which only 47 minutes add value (PCE 0.5 %).' } },

{ id: 'kaizen', sym: 'Kz', cat: 'lean', ph: ['I'], widget: null,
  name: { cs: 'Kaizen', en: 'Kaizen' },
  short: { cs: 'Neustálé zlepšování malými kroky – každý den, každý.', en: 'Continuous improvement in small steps – everyone, every day.' },
  what: { cs: 'Kaizen (jap. „změna k lepšímu“) je filozofie i praxe neustálého zlepšování. Má formu denních malých zlepšení (zlepšovací návrhy) i intenzivních několikadenních workshopů (Kaizen event / Kaizen blitz).',
          en: 'Kaizen (Japanese “change for the better”) is both philosophy and practice of continuous improvement. It ranges from small daily improvements (suggestions) to intense multi-day workshops (Kaizen events / blitz).' },
  when: { cs: ['Konkrétní, ohraničený problém v jedné oblasti', 'Rychlé výsledky během 3–5 dní', 'Zapojení pracovníků z linky'],
          en: ['A specific, scoped problem in one area', 'Quick results within 3–5 days', 'Engaging shop-floor employees'] },
  steps: { cs: ['Příprava – rozsah, cíl, tým, data', 'Den 1: školení a gemba, současný stav', 'Den 2: analýza příčin a plýtvání', 'Den 3–4: zkoušení a zavádění řešení', 'Den 5: standardizace, prezentace, 30denní plán'],
           en: ['Preparation – scope, target, team, data', 'Day 1: training and gemba, current state', 'Day 2: root cause and waste analysis', 'Day 3–4: trial and implement solutions', 'Day 5: standardise, present, 30-day plan'] },
  tips: { cs: ['Raději 100 malých zlepšení než 1 velké', 'Oceňte každý nápad – rychlá zpětná vazba', 'Bez standardizace se zlepšení ztratí'],
          en: ['Rather 100 small improvements than 1 big one', 'Recognise every idea – fast feedback', 'Without standardisation the gain is lost'] },
  example: { cs: 'Pětidenní kaizen na balicí lince zkrátil přestavbu formátu palet ze 45 na 18 minut.',
             en: 'A five-day kaizen on the packing line cut pallet format changeover from 45 to 18 minutes.' } },

{ id: 'kanban', sym: 'Kb', cat: 'lean', ph: ['I', 'C'], widget: 'kanban',
  name: { cs: 'Kanban', en: 'Kanban' },
  short: { cs: 'Tahový systém řízený signálními kartami.', en: 'A pull system driven by signal cards.' },
  what: { cs: 'Kanban (jap. „karta, signál“) řídí výrobu a doplňování podle skutečné spotřeby. Předchozí proces vyrábí jen to, co si následující proces odebral. Omezuje nadvýrobu a zásoby.',
          en: 'Kanban (Japanese “card, signal”) drives production and replenishment by actual consumption. The upstream process makes only what the downstream process has taken. It limits overproduction and inventory.' },
  when: { cs: ['Opakující se výroba se stabilní poptávkou', 'Doplňování spotřebního materiálu (C-díly)', 'Propojení procesů, které nelze spojit do toku'],
          en: ['Repetitive production with stable demand', 'Replenishing consumables (C-parts)', 'Linking processes that cannot flow continuously'] },
  steps: { cs: ['Určete položky vhodné pro kanban', 'Spočítejte počet karet', 'Nastavte supermarket a pravidla odběru', 'Vizualizujte (kanban tabule, barvy)', 'Postupně snižujte počet karet a odhalujte problémy'],
           en: ['Select items suitable for kanban', 'Calculate the number of cards', 'Set up a supermarket and withdrawal rules', 'Visualise it (kanban board, colours)', 'Gradually reduce cards to expose problems'] },
  tips: { cs: ['Žádná výroba bez karty', 'Vždy jen bezvadné díly do supermarketu', 'Počet karet pravidelně přepočítávejte'],
          en: ['No production without a card', 'Only good parts go to the supermarket', 'Recalculate the number of cards regularly'] },
  example: { cs: 'Lepicí pásky na balení se doplňují dvoubinovým kanbanem – žádné výpadky a o 40 % nižší zásoba.',
             en: 'Packing tapes are replenished with a two-bin kanban – no stock-outs and 40 % less inventory.' } },

{ id: 'smed', sym: 'Sm', cat: 'lean', ph: ['I'], widget: 'smed',
  name: { cs: 'SMED – rychlé přestavby', en: 'SMED – Quick Changeover' },
  short: { cs: 'Přestavba za méně než 10 minut.', en: 'Changeover in under 10 minutes.' },
  what: { cs: 'SMED (Single Minute Exchange of Die) zkracuje dobu přestavby převedením činností z interních (stroj stojí) na externí (stroj běží) a zjednodušením zbylých interních činností.',
          en: 'SMED (Single Minute Exchange of Die) shortens changeovers by converting internal activities (machine stopped) to external ones (machine running) and streamlining the rest.' },
  when: { cs: ['Dlouhé přestavby omezují kapacitu', 'Potřeba menších dávek a vyšší flexibility', 'Nízká dostupnost v OEE kvůli přestavbám'],
          en: ['Long changeovers limit capacity', 'Need for smaller batches and higher flexibility', 'Low OEE availability due to changeovers'] },
  steps: { cs: ['Natočte a zaznamenejte celou přestavbu', 'Rozdělte činnosti na interní a externí', 'Převeďte co nejvíce na externí (příprava předem)', 'Zjednodušte interní (rychloupínky, paralelní práce)', 'Standardizujte a trénujte'],
           en: ['Film and record the whole changeover', 'Split activities into internal and external', 'Convert as many as possible to external (prepare in advance)', 'Streamline internal ones (quick clamps, parallel work)', 'Standardise and train'] },
  tips: { cs: ['Hledání a donášení je vždy externí činnost', 'Šrouby nahraďte rychloupínáním', 'Seřizování eliminujte pevnými dorazy'],
          en: ['Searching and fetching are always external', 'Replace bolts with quick clamps', 'Eliminate adjustments with fixed stops'] },
  example: { cs: 'Změna tloušťky desky trvala 52 minut; po přípravě nástrojů předem a dorazech 21 minut.',
             en: 'Board thickness change took 52 minutes; after preparing tools in advance and fixed stops, 21 minutes.' } },

{ id: 'pokayoke', sym: 'Py', cat: 'lean', ph: ['I', 'C'], widget: null,
  name: { cs: 'Poka-Yoke', en: 'Poka-Yoke' },
  short: { cs: 'Ochrana proti chybě – správně napoprvé.', en: 'Mistake-proofing – right first time.' },
  what: { cs: 'Poka-Yoke je jednoduché zařízení nebo metoda, která chybě zabrání nebo ji okamžitě odhalí. Lidé dělají chyby – proces má být navržen tak, aby se z nich nestaly vady.',
          en: 'Poka-Yoke is a simple device or method that prevents a mistake or detects it immediately. People make mistakes – processes should be designed so mistakes do not become defects.' },
  when: { cs: ['Opakující se lidské chyby', 'Vady s vysokým dopadem na zákazníka (vysoké S ve FMEA)', 'Jako trvalé opatření místo „proškolení“'],
          en: ['Recurring human errors', 'Defects with high customer impact (high S in FMEA)', 'As a permanent fix instead of “retraining”'] },
  steps: { cs: ['Popište chybu a kde vzniká', 'Najděte kořenovou příčinu', 'Zvolte typ: prevence (nelze udělat špatně) nebo detekce', 'Navrhněte jednoduché a levné řešení', 'Ověřte funkčnost a pravidelně kontrolujte'],
           en: ['Describe the mistake and where it occurs', 'Find the root cause', 'Choose a type: prevention (cannot be done wrong) or detection', 'Design a simple, cheap solution', 'Verify function and check it regularly'] },
  tips: { cs: ['Prevence je lepší než detekce', 'Nejlepší poka-yoke stojí pár korun', 'Pravidelně testujte, že poka-yoke funguje'],
          en: ['Prevention beats detection', 'The best poka-yokes cost very little', 'Regularly test that the poka-yoke works'] },
  example: { cs: 'Asymetrický kolík na držáku role kartonu znemožní nasadit roli obráceně.',
             en: 'An asymmetric pin on the paper roll holder makes it impossible to mount the roll the wrong way.' } },

{ id: 'oee', sym: 'Oe', cat: 'lean', ph: ['M', 'C'], widget: 'oee',
  name: { cs: 'OEE – celková efektivita zařízení', en: 'OEE – Overall Equipment Effectiveness' },
  short: { cs: 'Dostupnost × Výkon × Kvalita.', en: 'Availability × Performance × Quality.' },
  what: { cs: 'OEE vyjadřuje, jak velká část plánovaného času je skutečně produktivní. Kombinuje tři ztráty: prostoje (dostupnost), pomalý chod a mikroprostoje (výkon) a zmetky (kvalita). Světová třída je ≈ 85 %.',
          en: 'OEE shows how much planned time is truly productive. It combines three losses: downtime (availability), slow running and minor stops (performance) and scrap (quality). World class is ≈ 85 %.' },
  when: { cs: ['Měření a porovnání výkonnosti strojů a linek', 'Identifikace největší ztráty (6 velkých ztrát)', 'Řízení TPM a projektů zlepšování'],
          en: ['Measuring and comparing machine/line performance', 'Finding the biggest loss (six big losses)', 'Steering TPM and improvement projects'] },
  steps: { cs: ['Určete plánovaný provozní čas', 'Zaznamenávejte prostoje a jejich důvody', 'Znejte ideální takt stroje', 'Počítejte celkové a dobré kusy', 'Spočítejte A, P, Q a OEE a analyzujte ztráty'],
           en: ['Determine planned production time', 'Record downtime and its reasons', 'Know the ideal cycle time', 'Count total and good pieces', 'Calculate A, P, Q and OEE and analyse losses'] },
  tips: { cs: ['OEE porovnávejte v čase, ne mezi různými stroji', 'Sledujte složky – samotné číslo nestačí', 'Mikroprostoje často „schovává“ výkon'],
          en: ['Compare OEE over time, not across different machines', 'Track the components – the single number is not enough', 'Minor stops often hide in performance'] },
  example: { cs: 'Linka: A 88 %, P 92 %, Q 97 % → OEE 78,5 %. Největší ztrátou jsou přestavby.',
             en: 'Line: A 88 %, P 92 %, Q 97 % → OEE 78.5 %. Changeovers are the biggest loss.' } },

{ id: 'takt', sym: 'Tk', cat: 'lean', ph: ['A', 'I'], widget: 'takt',
  name: { cs: 'Takt time a vyvažování linky', en: 'Takt Time & Line Balancing' },
  short: { cs: 'Rytmus výroby daný zákazníkem.', en: 'The production rhythm set by the customer.' },
  what: { cs: 'Takt time = dostupný čas / poptávka zákazníka. Určuje, jak často musí linka vyrobit jeden kus. Porovnání s časy cyklu jednotlivých pracovišť (Yamazumi graf) odhalí úzká místa a nevyváženost.',
          en: 'Takt time = available time / customer demand. It defines how often the line must produce one piece. Comparing it with station cycle times (Yamazumi chart) reveals bottlenecks and imbalance.' },
  when: { cs: ['Návrh nebo úprava linky', 'Změna poptávky', 'Hledání úzkého místa'],
          en: ['Designing or redesigning a line', 'Changing demand', 'Finding the bottleneck'] },
  steps: { cs: ['Spočítejte čistý dostupný čas', 'Zjistěte poptávku za stejné období', 'Vypočtěte takt time', 'Změřte časy cyklu pracovišť', 'Přerozdělte práci tak, aby všechny C/T byly těsně pod taktem'],
           en: ['Calculate net available time', 'Get demand for the same period', 'Compute takt time', 'Measure station cycle times', 'Redistribute work so all C/Ts sit just below takt'] },
  tips: { cs: ['Takt time se neměří, počítá se', 'Cílový C/T ≈ 85–95 % taktu', 'Min. počet operátorů = Σ C/T / takt'],
          en: ['Takt time is calculated, not measured', 'Target C/T ≈ 85–95 % of takt', 'Min. operators = Σ C/T / takt'] },
  example: { cs: 'Dostupných 450 min a poptávka 900 balíků → takt 30 s. Pracoviště paletizace s C/T 34 s je úzké místo.',
             en: '450 min available and demand of 900 packs → takt 30 s. The palletising station with C/T 34 s is the bottleneck.' } },

{ id: 'standard', sym: 'Sw', cat: 'lean', ph: ['I', 'C'], widget: null,
  name: { cs: 'Standardizovaná práce', en: 'Standard Work' },
  short: { cs: 'Nejlepší známý způsob – základ pro zlepšení.', en: 'The best known way – the baseline for improvement.' },
  what: { cs: 'Dokumentovaný nejlepší současný postup práce se třemi prvky: takt time, sekvence kroků a standardní rozpracovanost (WIP). Bez standardu není zlepšování – není s čím porovnávat.',
          en: 'The documented best current method with three elements: takt time, work sequence and standard work-in-process. Without a standard there is no improvement – nothing to compare against.' },
  when: { cs: ['Po každém zlepšení', 'Zaškolování nových pracovníků', 'Kolísání kvality mezi směnami'],
          en: ['After every improvement', 'Training new employees', 'Quality varying between shifts'] },
  steps: { cs: ['Pozorujte a měřte práci několika pracovníků', 'Vyberte nejlepší postup a sestavte sekvenci', 'Zdokumentujte (fotky, klíčové body, důvody)', 'Zaškolte metodou TWI (ukaž – vyzkoušej – ověř)', 'Ověřujte dodržování a standard zlepšujte'],
           en: ['Observe and time the work of several operators', 'Pick the best method and build the sequence', 'Document it (photos, key points, reasons why)', 'Train with TWI (show – try – check)', 'Audit adherence and improve the standard'] },
  tips: { cs: ['Standard píší ti, kdo práci dělají', 'Více obrázků, méně textu', 'Standard není dogma – je to výchozí bod'],
          en: ['Standards are written by those who do the work', 'More pictures, less text', 'A standard is not dogma – it is a starting point'] },
  example: { cs: 'Jednostránkový fotostandard výměny nože na pile sjednotil postup ve všech třech směnách.',
             en: 'A one-page photo standard for saw blade replacement aligned the method across all three shifts.' } },

{ id: 'tpm', sym: 'Tp', cat: 'lean', ph: ['I', 'C'], widget: null,
  name: { cs: 'TPM – totálně produktivní údržba', en: 'TPM – Total Productive Maintenance' },
  short: { cs: 'Nulové poruchy díky péči operátorů i údržby.', en: 'Zero breakdowns through care by operators and maintenance.' },
  what: { cs: 'TPM zapojuje všechny do péče o zařízení. Operátoři provádějí autonomní údržbu (čištění, mazání, kontroly), údržba se soustředí na plánovanou a prediktivní údržbu. Cílem je nulové poruchy, nulové vady a nulové úrazy.',
          en: 'TPM involves everyone in equipment care. Operators perform autonomous maintenance (cleaning, lubrication, inspection) while maintenance focuses on planned and predictive work. The goal: zero breakdowns, zero defects, zero accidents.' },
  when: { cs: ['Nízká dostupnost a časté poruchy', 'Opakované drobné závady', 'Kritická zařízení – úzká místa'],
          en: ['Low availability and frequent breakdowns', 'Recurring minor faults', 'Critical bottleneck equipment'] },
  steps: { cs: ['Počáteční čištění a odhalení abnormalit (štítky)', 'Odstranění zdrojů znečištění a těžko dostupných míst', 'Standardy čištění, mazání a kontrol', 'Obecná kontrola a školení operátorů', 'Autonomní údržba a neustálé zlepšování'],
           en: ['Initial cleaning and tagging of abnormalities', 'Eliminating contamination sources and hard-to-reach areas', 'Cleaning, lubrication and inspection standards', 'General inspection and operator training', 'Autonomous maintenance and continuous improvement'] },
  tips: { cs: ['Sledujte MTBF a MTTR', 'Čištění je kontrola', 'Začněte pilotním strojem'],
          en: ['Track MTBF and MTTR', 'Cleaning is inspection', 'Start with a pilot machine'] },
  example: { cs: 'Autonomní údržba míchačky sádrové kaše snížila neplánované prostoje o 35 %.',
             en: 'Autonomous maintenance of the gypsum slurry mixer reduced unplanned downtime by 35 %.' } },

{ id: 'gemba', sym: 'Gw', cat: 'lean', ph: ['D', 'M'], widget: null,
  name: { cs: 'Gemba Walk', en: 'Gemba Walk' },
  short: { cs: 'Jdi a viz – tam, kde vzniká hodnota.', en: 'Go and see – where value is created.' },
  what: { cs: 'Gemba (jap. „skutečné místo“) je místo, kde vzniká hodnota. Gemba walk je pravidelná procházka vedoucích po pracovišti s cílem pozorovat, ptát se a učit se – ne kontrolovat a obviňovat.',
          en: 'Gemba (Japanese “the real place”) is where value is created. A gemba walk is a regular walk by leaders to observe, ask and learn – not to inspect and blame.' },
  when: { cs: ['Pravidelně – denně/týdně jako součást řízení', 'Při řešení problému', 'Ověření dodržování standardů'],
          en: ['Regularly – daily/weekly as part of management', 'When solving a problem', 'Verifying standard adherence'] },
  steps: { cs: ['Stanovte účel a téma procházky', 'Jděte na místo a pozorujte proces', 'Ptejte se otevřenými otázkami (Proč? Jak?)', 'Zaznamenejte postřehy a plýtvání', 'Domluvte další kroky a dejte zpětnou vazbu'],
           en: ['Set the purpose and topic of the walk', 'Go to the place and observe the process', 'Ask open questions (Why? How?)', 'Note observations and waste', 'Agree next steps and give feedback'] },
  tips: { cs: ['Respekt k lidem – obviňujte proces, ne lidi', 'Stůjte v kruhu Taiichiho Ohna', 'Méně mluvit, více pozorovat'],
          en: ['Respect for people – blame the process, not the people', 'Stand in the Ohno circle', 'Talk less, observe more'] },
  example: { cs: 'Vedoucí výroby každé ráno navštíví tabuli shopfloor managementu a jedno pracoviště.',
             en: 'The production manager visits the shop-floor board and one workstation every morning.' } },

{ id: 'jidoka', sym: 'Jd', cat: 'lean', ph: ['I', 'C'], widget: null,
  name: { cs: 'Jidoka a Andon', en: 'Jidoka & Andon' },
  short: { cs: 'Zastav při problému – kvalita zabudovaná do procesu.', en: 'Stop at abnormality – quality built into the process.' },
  what: { cs: 'Jidoka („automatizace s lidským dotykem“) znamená, že stroj nebo pracovník zastaví při abnormalitě, aby vada nepostoupila dál. Andon je vizuální/zvukový signál, který přivolá pomoc.',
          en: 'Jidoka (“automation with a human touch”) means a machine or worker stops at an abnormality so defects don’t flow on. Andon is the visual/audible signal that calls for help.' },
  when: { cs: ['Vady se odhalují pozdě nebo u zákazníka', 'Potřeba rychlé reakce na problém', 'Automatizované linky'],
          en: ['Defects are found late or by the customer', 'Need for fast response to problems', 'Automated lines'] },
  steps: { cs: ['Definujte normální stav a abnormalitu', 'Zajistěte detekci (senzor, kontrola)', 'Zastavte / signalizujte (andon)', 'Opravte okamžitý problém', 'Řešte kořenovou příčinu'],
           en: ['Define normal and abnormal', 'Ensure detection (sensor, check)', 'Stop / signal (andon)', 'Fix the immediate problem', 'Solve the root cause'] },
  tips: { cs: ['Zastavení linky musí být oceněno, ne trestáno', 'Definujte eskalační pravidla a reakční časy', 'Jidoka je pilířem domu Toyota'],
          en: ['Stopping the line must be praised, not punished', 'Define escalation rules and response times', 'Jidoka is a pillar of the Toyota house'] },
  example: { cs: 'Kamera detekuje roztržený karton a automaticky zastaví nanášení kaše – žádné zmetkové metry.',
             en: 'A camera detects torn paper and stops slurry deposition automatically – no scrap metres.' } },

{ id: 'heijunka', sym: 'Hj', cat: 'lean', ph: ['I'], widget: 'heijunka',
  name: { cs: 'Heijunka – vyrovnávání výroby', en: 'Heijunka – Production Levelling' },
  short: { cs: 'Vyrovnaný objem i mix místo velkých dávek.', en: 'Level volume and mix instead of big batches.' },
  what: { cs: 'Heijunka rozkládá výrobu různých produktů rovnoměrně v čase (např. ABACAB místo AAAABBCC). Snižuje zásoby, vyhlazuje zátěž lidí a dodavatelů a zlepšuje reakci na poptávku.',
          en: 'Heijunka spreads the production of different products evenly over time (e.g. ABACAB instead of AAAABBCC). It reduces inventory, smooths workload for people and suppliers and improves responsiveness.' },
  when: { cs: ['Kolísající zátěž a velké dávky', 'Vysoké zásoby hotových výrobků', 'Po zkrácení přestaveb (SMED)'],
          en: ['Fluctuating workload and large batches', 'High finished-goods inventory', 'After shortening changeovers (SMED)'] },
  steps: { cs: ['Analyzujte poptávku podle produktů', 'Zkraťte přestavby (SMED)', 'Určete opakovací vzor (pitch)', 'Použijte heijunka box', 'Vyhodnocujte a upravujte vzor'],
           en: ['Analyse demand by product', 'Shorten changeovers (SMED)', 'Define the repeating pattern (pitch)', 'Use a heijunka box', 'Review and adjust the pattern'] },
  tips: { cs: ['Bez rychlých přestaveb heijunka nefunguje', 'Začněte vyrovnáním týdne, pak dne', 'Kombinujte s kanbanem'],
          en: ['Heijunka does not work without quick changeovers', 'Start by levelling the week, then the day', 'Combine with kanban'] },
  example: { cs: 'Místo 3 dnů standardní desky a 1 dne protipožární se vyrábí každý den obojí ve stálém poměru.',
             en: 'Instead of 3 days of standard board and 1 day of fire-rated board, both are made every day in a fixed ratio.' } },

/* ---------------- SIX SIGMA ---------------- */
{ id: 'dmaic', sym: 'Dm', cat: 'ss', ph: ['D', 'M', 'A', 'I', 'C'], widget: 'dmaic',
  name: { cs: 'DMAIC', en: 'DMAIC' },
  short: { cs: 'Pětifázová cesta projektu Six Sigma.', en: 'The five-phase road of a Six Sigma project.' },
  what: { cs: 'DMAIC je strukturovaný postup zlepšování existujícího procesu: Define (definovat), Measure (měřit), Analyze (analyzovat), Improve (zlepšit), Control (řídit). Každá fáze končí přezkoumáním (tollgate).',
          en: 'DMAIC is a structured approach to improving an existing process: Define, Measure, Analyze, Improve, Control. Each phase ends with a tollgate review.' },
  when: { cs: ['Problém s neznámou příčinou', 'Proces existuje a lze ho měřit', 'Významný dopad na zákazníka nebo náklady'],
          en: ['A problem with an unknown root cause', 'An existing, measurable process', 'Significant impact on customers or costs'] },
  steps: { cs: ['Define – charta projektu, SIPOC, VOC/CTQ', 'Measure – plán sběru dat, MSA, výchozí výkonnost', 'Analyze – identifikace a ověření kořenových příčin', 'Improve – návrh, test a zavedení řešení', 'Control – kontrolní plán, SPC, předání vlastníkovi procesu'],
           en: ['Define – project charter, SIPOC, VOC/CTQ', 'Measure – data plan, MSA, baseline performance', 'Analyze – identify and verify root causes', 'Improve – design, pilot and implement solutions', 'Control – control plan, SPC, hand-over to the process owner'] },
  tips: { cs: ['Nepřeskakujte do Improve s hotovým řešením', 'Dobrá charta = polovina úspěchu', 'Pro nové procesy použijte DMADV / DFSS'],
          en: ['Don’t jump to Improve with a ready-made solution', 'A good charter is half the success', 'For new processes use DMADV / DFSS'] },
  example: { cs: 'Projekt „Snížení zmetkovitosti linky 2 z 3,2 % na 1,5 %“ s úsporou 4,1 mil. Kč ročně.',
             en: 'Project “Reduce line 2 scrap from 3.2 % to 1.5 %” saving €165k per year.' } },

{ id: 'sipoc', sym: 'Si', cat: 'ss', ph: ['D'], widget: 'sipoc',
  name: { cs: 'SIPOC', en: 'SIPOC' },
  short: { cs: 'Proces z výšky – dodavatelé až zákazníci.', en: 'The process from above – suppliers to customers.' },
  what: { cs: 'SIPOC je vysokoúrovňová mapa procesu: Suppliers (dodavatelé), Inputs (vstupy), Process (4–7 hlavních kroků), Outputs (výstupy), Customers (zákazníci). Vymezuje hranice projektu.',
          en: 'SIPOC is a high-level process map: Suppliers, Inputs, Process (4–7 main steps), Outputs, Customers. It sets the project boundaries.' },
  when: { cs: ['Fáze Define – vymezení rozsahu', 'Společné porozumění procesu v týmu', 'Před detailní procesní mapou'],
          en: ['Define phase – scoping', 'Shared understanding of the process in the team', 'Before a detailed process map'] },
  steps: { cs: ['Pojmenujte proces a jeho začátek a konec', 'Doplňte 4–7 hlavních kroků (P)', 'Určete výstupy (O) a zákazníky (C)', 'Určete vstupy (I) a dodavatele (S)', 'Ověřte s vlastníkem procesu'],
           en: ['Name the process and its start and end points', 'Add 4–7 main steps (P)', 'Identify outputs (O) and customers (C)', 'Identify inputs (I) and suppliers (S)', 'Validate with the process owner'] },
  tips: { cs: ['Začněte uprostřed – procesem', 'Kroky pište jako sloveso + podstatné jméno', 'Zákazník může být i interní'],
          en: ['Start in the middle – the process', 'Write steps as verb + noun', 'Customers can be internal too'] },
  example: { cs: 'Výroba sádrokartonu: Dodavatelé – lom, papírna; Vstupy – sádrovec, karton, voda, aditiva; Výstupy – palety desek.',
             en: 'Plasterboard production: Suppliers – quarry, paper mill; Inputs – gypsum, paper, water, additives; Outputs – pallets of boards.' } },

{ id: 'voc', sym: 'Vc', cat: 'ss', ph: ['D'], widget: null,
  name: { cs: 'VOC a CTQ strom', en: 'VOC & CTQ Tree' },
  short: { cs: 'Od hlasu zákazníka k měřitelným požadavkům.', en: 'From the voice of the customer to measurable requirements.' },
  what: { cs: 'Voice of Customer (VOC) jsou potřeby zákazníka jeho slovy. CTQ strom (Critical to Quality) je převádí přes hlavní potřeby (drivers) na měřitelné charakteristiky se specifikací.',
          en: 'Voice of the Customer (VOC) are customer needs in their own words. The CTQ (Critical to Quality) tree translates them via drivers into measurable characteristics with specifications.' },
  when: { cs: ['Fáze Define – co je pro zákazníka důležité', 'Stanovení metrik projektu (Y)', 'Vývoj nových produktů'],
          en: ['Define phase – what matters to the customer', 'Setting project metrics (Y)', 'New product development'] },
  steps: { cs: ['Sbírejte VOC – reklamace, rozhovory, průzkumy', 'Seskupte výroky do potřeb', 'Určete hnací faktory (drivers)', 'Převeďte na měřitelné CTQ', 'Stanovte specifikace a cílové hodnoty'],
           en: ['Gather VOC – complaints, interviews, surveys', 'Group statements into needs', 'Identify drivers', 'Translate into measurable CTQs', 'Set specifications and targets'] },
  tips: { cs: ['Použijte Kanův model (základní, výkonové, nadšení)', 'CTQ musí být měřitelné', 'Zákazník neříká „Cpk“ – říká „desky do sebe nepasují“'],
          en: ['Use the Kano model (basic, performance, delighters)', 'CTQs must be measurable', 'Customers don’t say “Cpk” – they say “boards don’t fit”'] },
  example: { cs: 'VOC „desky se špatně montují“ → driver „rovné hrany“ → CTQ „pravoúhlost ≤ 2 mm/1,2 m“.',
             en: 'VOC “boards are hard to install” → driver “straight edges” → CTQ “squareness ≤ 2 mm per 1.2 m”.' } },

{ id: 'procmap', sym: 'Pm', cat: 'ss', ph: ['D', 'M'], widget: null,
  name: { cs: 'Procesní mapa / vývojový diagram', en: 'Process Map / Flowchart' },
  short: { cs: 'Každý krok, rozhodnutí a smyčka procesu.', en: 'Every step, decision and loop of the process.' },
  what: { cs: 'Grafické znázornění sledu činností, rozhodnutí a toků. Swimlane varianta ukazuje odpovědnost oddělení. Často se uvádí jako jeden ze 7 nástrojů kvality místo stratifikace.',
          en: 'A graphical representation of the sequence of activities, decisions and flows. The swimlane variant shows departmental responsibility. Often listed as one of the 7 QC tools instead of stratification.' },
  when: { cs: ['Pochopení skutečného průběhu procesu', 'Hledání přepracování, smyček a předávek', 'Návrh nového procesu'],
          en: ['Understanding how the process really runs', 'Finding rework loops and hand-offs', 'Designing a new process'] },
  steps: { cs: ['Určete hranice procesu', 'Zmapujte skutečný stav (ne ideální)', 'Použijte standardní symboly (ovál, obdélník, kosočtverec)', 'Označte VA / NVA kroky', 'Navrhněte zjednodušení'],
           en: ['Set the process boundaries', 'Map the actual state (not the ideal)', 'Use standard symbols (oval, rectangle, diamond)', 'Mark VA / NVA steps', 'Propose simplifications'] },
  tips: { cs: ['Mapujte s lidmi, kteří proces dělají', 'Každý kosočtverec = možná chyba', 'Lepíky na zdi > software'],
          en: ['Map with the people who do the work', 'Every diamond is a potential error', 'Sticky notes on a wall > software'] },
  example: { cs: 'Mapa procesu reklamace odhalila 4 předávky mezi odděleními a 2 smyčky přepracování.',
             en: 'The complaint process map revealed 4 hand-offs between departments and 2 rework loops.' } },

{ id: 'msa', sym: 'Ms', cat: 'ss', ph: ['M'], widget: 'msa',
  name: { cs: 'MSA / Gage R&R', en: 'MSA / Gage R&R' },
  short: { cs: 'Můžeme věřit svým měřením?', en: 'Can we trust our measurements?' },
  what: { cs: 'Analýza systému měření ověřuje, jaká část pozorované variability pochází z měřidla a obsluhy. Gage R&R rozkládá variabilitu na opakovatelnost (měřidlo) a reprodukovatelnost (operátoři).',
          en: 'Measurement System Analysis checks how much of the observed variation comes from the gauge and operators. Gage R&R splits it into repeatability (equipment) and reproducibility (appraisers).' },
  when: { cs: ['Fáze Measure – před sběrem dat', 'Nové měřidlo nebo metoda', 'Spory o výsledky měření'],
          en: ['Measure phase – before data collection', 'New gauge or method', 'Disputes about measurement results'] },
  steps: { cs: ['Vyberte 10 dílů pokrývajících variabilitu procesu', '2–3 operátoři, každý měří 2–3krát', 'Měřte náhodně a „naslepo“', 'Vypočtěte EV, AV, GRR a ndc', 'Vyhodnoťte a případně zlepšete měřicí systém'],
           en: ['Select 10 parts covering process variation', '2–3 operators, each measures 2–3 times', 'Measure randomly and “blind”', 'Calculate EV, AV, GRR and ndc', 'Evaluate and improve the system if needed'] },
  tips: { cs: ['%GRR < 10 % vyhovuje, 10–30 % podmíněně, > 30 % nevyhovuje', 'ndc ≥ 5', 'Pro atributivní data použijte Attribute Agreement Analysis'],
          en: ['%GRR < 10 % acceptable, 10–30 % conditional, > 30 % unacceptable', 'ndc ≥ 5', 'For attribute data use Attribute Agreement Analysis'] },
  example: { cs: 'Posuvné měřítko pro tloušťku desky mělo %GRR 34 %; po zavedení přípravku s indikátorem 8 %.',
             en: 'The caliper for board thickness had 34 % GRR; with a dial-indicator fixture it dropped to 8 %.' } },

{ id: 'capability', sym: 'Cp', cat: 'ss', ph: ['M', 'C'], widget: 'capability',
  name: { cs: 'Způsobilost procesu (Cp, Cpk)', en: 'Process Capability (Cp, Cpk)' },
  short: { cs: 'Vejde se hlas procesu do hlasu zákazníka?', en: 'Does the voice of the process fit the voice of the customer?' },
  what: { cs: 'Indexy způsobilosti porovnávají šířku tolerance se šířkou procesu (6σ). Cp hodnotí potenciál, Cpk zohledňuje i centrování. Pp/Ppk používají celkovou směrodatnou odchylku (dlouhodobá výkonnost).',
          en: 'Capability indices compare the tolerance width with the process spread (6σ). Cp shows potential, Cpk also accounts for centring. Pp/Ppk use overall standard deviation (long-term performance).' },
  when: { cs: ['Výchozí stav v Measure a ověření v Control', 'Schvalování procesu (PPAP)', 'Rozhodování o kontrolách'],
          en: ['Baseline in Measure and verification in Control', 'Process approval (PPAP)', 'Deciding on inspection'] },
  steps: { cs: ['Ověřte stabilitu (regulační diagram)', 'Ověřte normalitu dat', 'Spočítejte průměr a σ', 'Cp = (USL−LSL)/6σ; Cpk = min(USL−x̄, x̄−LSL)/3σ', 'Porovnejte s cílem (typicky ≥ 1,33)'],
           en: ['Verify stability (control chart)', 'Check normality', 'Compute mean and σ', 'Cp = (USL−LSL)/6σ; Cpk = min(USL−x̄, x̄−LSL)/3σ', 'Compare with target (typically ≥ 1.33)'] },
  tips: { cs: ['Cpk < Cp → proces není centrovaný', 'Nestabilní proces nemá smysl hodnotit', 'Cpk 1,33 ≈ 63 ppm, Cpk 1,67 ≈ 0,6 ppm'],
          en: ['Cpk < Cp → process is off-centre', 'Assessing an unstable process is meaningless', 'Cpk 1.33 ≈ 63 ppm, Cpk 1.67 ≈ 0.6 ppm'] },
  example: { cs: 'Tloušťka 12,5 ± 0,5 mm: Cp 1,4, ale Cpk 0,95 – stačí proces vycentrovat.',
             en: 'Thickness 12.5 ± 0.5 mm: Cp 1.4 but Cpk 0.95 – centring the process is enough.' } },

{ id: 'sigma', sym: 'σ', cat: 'ss', ph: ['M', 'C'], widget: 'sigma',
  name: { cs: 'Sigma úroveň a DPMO', en: 'Sigma Level & DPMO' },
  short: { cs: 'Kolik vad na milion příležitostí?', en: 'How many defects per million opportunities?' },
  what: { cs: 'DPMO (Defects Per Million Opportunities) normalizuje počet vad podle složitosti výrobku. Sigma úroveň převádí výtěžnost na škálu, kde 6σ odpovídá 3,4 DPMO (s posunem 1,5σ).',
          en: 'DPMO (Defects Per Million Opportunities) normalises defects by product complexity. The sigma level converts yield to a scale where 6σ equals 3.4 DPMO (with the 1.5σ shift).' },
  when: { cs: ['Porovnání různých procesů a produktů', 'Výchozí stav a cíl projektu', 'Atributivní data (vada / bez vady)'],
          en: ['Comparing different processes and products', 'Project baseline and target', 'Attribute data (defect / no defect)'] },
  steps: { cs: ['Definujte jednotku, vadu a příležitost', 'Spočítejte jednotky a vady', 'DPU = vady / jednotky', 'DPMO = vady / (jednotky × příležitosti) × 10⁶', 'Převeďte na sigma úroveň'],
           en: ['Define unit, defect and opportunity', 'Count units and defects', 'DPU = defects / units', 'DPMO = defects / (units × opportunities) × 10⁶', 'Convert to sigma level'] },
  tips: { cs: ['Nepřifukujte počet příležitostí', '3σ ≈ 66 807 DPMO, 4σ ≈ 6 210, 5σ ≈ 233', 'Posun 1,5σ je konvence pro dlouhodobý drift'],
          en: ['Don’t inflate the number of opportunities', '3σ ≈ 66,807 DPMO, 4σ ≈ 6,210, 5σ ≈ 233', 'The 1.5σ shift is a convention for long-term drift'] },
  example: { cs: '50 000 desek, 5 příležitostí, 420 vad → DPMO 1 680 → 4,4σ.',
             en: '50,000 boards, 5 opportunities, 420 defects → DPMO 1,680 → 4.4σ.' } },

{ id: 'fmea', sym: 'Fm', cat: 'ss', ph: ['A', 'I', 'C'], widget: 'fmea',
  name: { cs: 'FMEA', en: 'FMEA' },
  short: { cs: 'Předcházejte selháním dříve, než nastanou.', en: 'Prevent failures before they happen.' },
  what: { cs: 'Analýza možných vad a jejich důsledků hodnotí každý způsob selhání podle Závažnosti (S), Výskytu (O) a Odhalitelnosti (D). RPN = S × O × D pomáhá prioritizovat opatření. Nová metodika AIAG-VDA používá Action Priority (AP).',
          en: 'Failure Mode and Effects Analysis rates each failure mode by Severity (S), Occurrence (O) and Detection (D). RPN = S × O × D helps prioritise actions. The newer AIAG-VDA method uses Action Priority (AP).' },
  when: { cs: ['Návrh nového produktu nebo procesu', 'Změna procesu', 'Fáze Analyze/Improve – rizika řešení'],
          en: ['Designing a new product or process', 'Process changes', 'Analyze/Improve – risks of solutions'] },
  steps: { cs: ['Rozepište proces na kroky', 'Ke každému kroku určete možné vady', 'Popište následky (S) a příčiny (O)', 'Popište současné kontroly (D)', 'Spočítejte RPN, navrhněte opatření a přehodnoťte'],
           en: ['Break the process into steps', 'Identify potential failure modes per step', 'Describe effects (S) and causes (O)', 'Describe current controls (D)', 'Calculate RPN, define actions and re-rate'] },
  tips: { cs: ['S = 9–10 řešte vždy bez ohledu na RPN', 'FMEA je živý dokument', 'Dělejte ji v mezioborovém týmu'],
          en: ['Always address S = 9–10 regardless of RPN', 'FMEA is a living document', 'Do it in a cross-functional team'] },
  example: { cs: 'Krok „Řezání desek“: vada „otřepená hrana“, S 6, O 5, D 4 → RPN 120 → plán výměny nožů dle počtu řezů.',
             en: 'Step “Cutting boards”: failure “ragged edge”, S 6, O 5, D 4 → RPN 120 → blade change plan by cut count.' } },

{ id: 'hypo', sym: 'Ht', cat: 'ss', ph: ['A'], widget: 'hypo',
  name: { cs: 'Testování hypotéz', en: 'Hypothesis Testing' },
  short: { cs: 'Je rozdíl skutečný, nebo jen náhoda?', en: 'Is the difference real or just chance?' },
  what: { cs: 'Statistický test rozhoduje mezi nulovou hypotézou H₀ (žádný rozdíl) a alternativou H₁. P-hodnota je pravděpodobnost pozorovat takový nebo větší rozdíl, pokud platí H₀. Je-li p < α (obvykle 0,05), H₀ zamítáme.',
          en: 'A statistical test decides between the null hypothesis H₀ (no difference) and the alternative H₁. The p-value is the probability of seeing such a difference or larger if H₀ is true. If p < α (usually 0.05), reject H₀.' },
  when: { cs: ['Ověření kořenové příčiny (Analyze)', 'Potvrzení účinku zlepšení (Improve)', 'Porovnání strojů, dodavatelů, směn'],
          en: ['Verifying a root cause (Analyze)', 'Confirming the effect of an improvement (Improve)', 'Comparing machines, suppliers, shifts'] },
  steps: { cs: ['Formulujte praktickou otázku', 'Stanovte H₀ a H₁ a hladinu α', 'Vyberte test (t-test, ANOVA, χ², …)', 'Sesbírejte data a spočítejte p-hodnotu', 'Přeložte statistický závěr zpět do praxe'],
           en: ['State the practical question', 'Define H₀, H₁ and α', 'Choose a test (t-test, ANOVA, χ², …)', 'Collect data and compute the p-value', 'Translate the statistical conclusion back into practice'] },
  tips: { cs: ['„If p is low, H₀ must go“', 'Statisticky významné ≠ prakticky významné', 'Ověřte předpoklady testu (normalita, rozptyly)'],
          en: ['“If p is low, H₀ must go”', 'Statistically significant ≠ practically significant', 'Check test assumptions (normality, variances)'] },
  example: { cs: 'Pevnost v ohybu od dodavatele A vs. B: p = 0,003 → rozdíl je statisticky významný.',
             en: 'Flexural strength from supplier A vs. B: p = 0.003 → the difference is statistically significant.' } },

{ id: 'doe', sym: 'Do', cat: 'ss', ph: ['I'], widget: null,
  name: { cs: 'Plánování experimentů (DOE)', en: 'Design of Experiments (DOE)' },
  short: { cs: 'Najděte optimální nastavení s minimem pokusů.', en: 'Find the optimal settings with minimum trials.' },
  what: { cs: 'DOE systematicky mění několik faktorů současně a měří odezvu. Na rozdíl od metody „jeden faktor najednou“ odhalí i interakce faktorů a potřebuje méně pokusů. Typické jsou plné a frakční faktoriální plány 2ᵏ.',
          en: 'DOE systematically varies several factors at once and measures the response. Unlike one-factor-at-a-time it reveals interactions and needs fewer runs. Full and fractional 2ᵏ factorial designs are typical.' },
  when: { cs: ['Optimalizace nastavení procesu', 'Více podezřelých faktorů najednou', 'Ověření kauzality (ne jen korelace)'],
          en: ['Optimising process settings', 'Several suspected factors at once', 'Proving causation (not just correlation)'] },
  steps: { cs: ['Definujte odezvu (Y) a cíl', 'Vyberte faktory a jejich úrovně', 'Zvolte plán (např. 2³ = 8 pokusů) a randomizujte', 'Proveďte pokusy a změřte odezvu', 'Analyzujte hlavní efekty a interakce, ověřte optimum'],
           en: ['Define the response (Y) and goal', 'Select factors and levels', 'Choose a design (e.g. 2³ = 8 runs) and randomise', 'Run the trials and measure the response', 'Analyse main effects and interactions, confirm the optimum'] },
  tips: { cs: ['Randomizujte pořadí pokusů', 'Zahrňte centrální body pro ověření zakřivení', 'Před DOE zajistěte dobrý měřicí systém'],
          en: ['Randomise the run order', 'Include centre points to check curvature', 'Ensure a capable measurement system before DOE'] },
  example: { cs: 'Plán 2³: teplota sušárny, rychlost linky, dávka škrobu → nalezena interakce teplota × rychlost.',
             en: '2³ design: dryer temperature, line speed, starch dosage → a temperature × speed interaction found.' } },

{ id: 'controlplan', sym: 'Cn', cat: 'ss', ph: ['C'], widget: null,
  name: { cs: 'Kontrolní plán', en: 'Control Plan' },
  short: { cs: 'Jak udržet zlepšení natrvalo.', en: 'How to make the gain stick.' },
  what: { cs: 'Kontrolní plán popisuje, které charakteristiky procesu a produktu se sledují, jak, jak často, kým a co dělat při odchylce (reakční plán). Je hlavním výstupem fáze Control.',
          en: 'A control plan describes which process and product characteristics are monitored, how, how often, by whom and what to do on deviation (reaction plan). It is the main output of the Control phase.' },
  when: { cs: ['Ukončení projektu DMAIC', 'Zavedení nového procesu', 'Po změně procesu'],
          en: ['Closing a DMAIC project', 'Launching a new process', 'After a process change'] },
  steps: { cs: ['Vypište klíčové X (vstupy) a Y (výstupy)', 'Určete specifikace a metodu měření', 'Stanovte četnost a velikost vzorku', 'Určete odpovědnost a nástroj (SPC, checklist)', 'Napište reakční plán a předejte vlastníkovi'],
           en: ['List key Xs (inputs) and Ys (outputs)', 'Define specifications and measurement method', 'Set frequency and sample size', 'Assign responsibility and tool (SPC, checklist)', 'Write the reaction plan and hand over to the owner'] },
  tips: { cs: ['Kontrolujte spíše X než Y – předcházíte vadám', 'Propojte s FMEA', 'Reakční plán musí být konkrétní'],
          en: ['Control the Xs rather than the Ys – prevent defects', 'Link it to the FMEA', 'The reaction plan must be specific'] },
  example: { cs: 'Teplota zóny 2 sušárny: 180 ± 5 °C, kontinuálně, SPC, při překročení upravit a informovat mistra.',
             en: 'Dryer zone 2 temperature: 180 ± 5 °C, continuous, SPC; if exceeded adjust and notify the supervisor.' } },
